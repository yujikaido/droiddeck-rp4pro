plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def gitValue = { List<String> arguments ->
    try {
        def output = providers.exec {
            commandLine(['git'] + arguments)
            workingDir rootProject.projectDir
            ignoreExitValue = true
        }
        output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        null
    }
}

def buildLabel = providers.environmentVariable('DROIDDECK_BUILD_LABEL').getOrNull()
if (buildLabel == null || buildLabel.trim().isEmpty()) {
    def eventName = providers.environmentVariable('GITHUB_EVENT_NAME').getOrNull()
    def eventPath = providers.environmentVariable('GITHUB_EVENT_PATH').getOrNull()
    if (eventName == 'pull_request_target' && eventPath) {
        try {
            def eventFile = layout.file(providers.provider { new File(eventPath) })
            def eventText = providers.fileContents(eventFile).asText.get()
            def pullRequest = new groovy.json.JsonSlurper().parseText(eventText).pull_request
            if (pullRequest?.number && pullRequest?.head?.sha) {
                buildLabel = "pr${pullRequest.number} at ${pullRequest.head.sha.take(7)}"
            }
        } catch (Exception ignored) {
        }
    }
    if (buildLabel == null || buildLabel.trim().isEmpty()) {
        def branch = providers.environmentVariable('GITHUB_REF_NAME').getOrNull()
            ?: gitValue(['branch', '--show-current']) ?: 'local'
        def commit = providers.environmentVariable('GITHUB_SHA').getOrNull()
            ?.take(7) ?: gitValue(['rev-parse', '--short=7', 'HEAD']) ?: 'unknown'
        buildLabel = "${branch} at ${commit}"
    }
}
def buildOrigin = providers.environmentVariable('GITHUB_ACTIONS').getOrNull() == 'true' ? 'remote' : 'local'
def treeState = providers.environmentVariable('DROIDDECK_BUILD_TREE_STATE').getOrNull()
if (!(treeState in ['clean', 'dirty'])) {
    def status = gitValue(['status', '--porcelain'])
    treeState = status == null ? 'unknown' : (status.isEmpty() ? 'clean' : 'dirty')
}
buildLabel = "${buildOrigin} ${treeState} · ${buildLabel}"
def escapedBuildLabel = buildLabel.replace('\\', '\\\\').replace('"', '\\"')

def sourceCommit = providers.environmentVariable('DROIDDECK_SOURCE_COMMIT').getOrNull()
    ?: providers.environmentVariable('GITHUB_SHA').getOrNull() ?: gitValue(['rev-parse', 'HEAD']) ?: ''
// The bridge's version as its own build names it (external/MaliBridge: nearest release tag), for log uploads
def maliBridgeVersion = (gitValue(['-C', 'external/MaliBridge', 'describe', '--tags', '--match', 'v[0-9]*']) ?: '').replace('"', '')
def prNumber = (providers.environmentVariable('DROIDDECK_PR_NUMBER').getOrNull() ?: '0').with { it.isInteger() ? it : '0' }
def ciBuild = providers.environmentVariable('GITHUB_ACTIONS').getOrNull() == 'true'
def releaseSigner = rootProject.file('keystore/release-signer.sha256').text.trim()
def commitTime = (gitValue(['show', '-s', '--format=%ct', 'HEAD']) ?: '0').with { it.isLong() ? it : '0' }
def desktopKde = rootProject.file('tools/desktop-kde/release.env').readLines()
    .findAll { it.contains('=') && !it.startsWith('#') }
    .collectEntries { def kv = it.split('=', 2); [(kv[0].trim()): kv[1].trim()] }
def desktopRemovalSources = new groovy.json.JsonSlurper().parse(file('src/main/assets/desktop-removal/sources.json'))
if (desktopRemovalSources.archives[desktopKde.DESKTOP_KDE_TAG] != desktopKde.DESKTOP_KDE_SHA256) {
    throw new GradleException('Desktop removal inventories do not match the pinned archive')
}
if (!file('src/main/assets/desktop-removal/versions.txt').readLines().contains(desktopKde.DESKTOP_KDE_TAG)) {
    throw new GradleException('Regenerate desktop removal inventories for ' + desktopKde.DESKTOP_KDE_TAG)
}
def variantSuffixes = rootProject.file('tools/release/variants.txt').readLines()
    .findAll { it.trim() && !it.startsWith('#') }
    .collect { def f = it.trim().split(/\s+/); "${f[1]}=${f[2] == '-' ? '' : f[2]}" }
    .join(';')

// Side-by-side builds, such as the MaliBridge test build: another applicationId, so the APK installs
// next to the standard app, and its own launcher name. DROIDDECK_APP_ID_SUFFIX (-Pdroiddeck.appIdSuffix,
// e.g. ".mali") is appended to com.droiddeck.launcher; DROIDDECK_APPLICATION_ID (-Pdroiddeck.applicationId)
// sets the whole id instead. DROIDDECK_APP_LABEL (-Pdroiddeck.appLabel) names the app in every language,
// "DroidDeck <Suffix>" by default for a suffix build. Unset, the build is the standard one. The
// namespace (R, BuildConfig, the JNI class names) stays com.droiddeck.launcher either way.
def buildSetting = { String env, String property ->
    (providers.environmentVariable(env).getOrNull() ?: project.findProperty(property))?.toString()?.trim() ?: ''
}
def standardApplicationId = 'com.droiddeck.launcher'
def appIdSuffix = buildSetting('DROIDDECK_APP_ID_SUFFIX', 'droiddeck.appIdSuffix')
def appIdOverride = buildSetting('DROIDDECK_APPLICATION_ID', 'droiddeck.applicationId')
if (appIdSuffix && appIdOverride) {
    throw new GradleException('Set DROIDDECK_APP_ID_SUFFIX or DROIDDECK_APPLICATION_ID, not both')
}
if (appIdSuffix && !(appIdSuffix ==~ /(\.[a-z][a-z0-9_]*)+/)) {
    throw new GradleException("DROIDDECK_APP_ID_SUFFIX must look like .mali, not '${appIdSuffix}'")
}
def droiddeckApplicationId = appIdOverride ?: standardApplicationId + appIdSuffix
if (!(droiddeckApplicationId ==~ /[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+/)) {
    throw new GradleException("Not an Android package name: '${droiddeckApplicationId}'")
}
def appLabel = buildSetting('DROIDDECK_APP_LABEL', 'droiddeck.appLabel')
if (!appLabel && appIdSuffix) {
    appLabel = 'DroidDeck ' + appIdSuffix.tokenize('.').collect { it.capitalize() }.join(' ')
}
if (appLabel) {
    // app_name, overridden for every language main/res translates it into: the build types' source
    // sets take precedence over main, so the 30-odd strings.xml stay as they are.
    def escaped = appLabel.replace('\\', '\\\\').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
        .replace("'", "\\'").replace('"', '\\"').replaceFirst(/^([@?])/, '\\\\$1')
    def labelRes = layout.buildDirectory.dir('generated/res/appLabel').get().asFile
    labelRes.deleteDir()
    file('src/main/res').listFiles().findAll { dir ->
        dir.isDirectory() && dir.name ==~ /values(-.+)?/ && new File(dir, 'strings.xml').with { it.isFile() && it.text.contains('name="app_name"') }
    }.each { dir ->
        new File(labelRes, dir.name).mkdirs()
        new File(labelRes, "${dir.name}/strings.xml").text =
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">${escaped}</string>\n</resources>\n"
    }
    android.sourceSets.debug.res.srcDir(labelRes)
    android.sourceSets.release.res.srcDir(labelRes)
}
// In-app updates for the MaliBridge build (applicationId ending in .mali): the app follows the releases of this
// GitHub repository instead of DroidDeck's catalog. For this RP4 Pro build that is its own repository: the official
// MaliBridge APKs are signed with another key and leave out these fixes. DROIDDECK_UPDATES_REPO
// (-Pdroiddeck.updatesRepo) names another owner/repo; empty for every other build.
def maliUpdatesRepo = buildSetting('DROIDDECK_UPDATES_REPO', 'droiddeck.updatesRepo') ?:
    (droiddeckApplicationId.endsWith('.mali') ? 'yujikaido/droiddeck-rp4pro' : '')
if (maliUpdatesRepo && !(maliUpdatesRepo ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/)) {
    throw new GradleException("DROIDDECK_UPDATES_REPO must look like owner/repo, not '${maliUpdatesRepo}'")
}
// The MaliBridge release this APK is published as (the release tag, e.g. v0.5.4), which the updater
// compares with the newest release: DROIDDECK_MALI_RELEASE (-Pdroiddeck.maliRelease), else
// tools/release/mali-release.txt. For the .mali build, versionName and versionCode follow it (below).
def maliRelease = buildSetting('DROIDDECK_MALI_RELEASE', 'droiddeck.maliRelease') ?:
    (rootProject.file('tools/release/mali-release.txt').with { it.isFile() ? it.readLines() : [] }
        .collect { it.trim() }.find { it && !it.startsWith('#') } ?: '')
if (maliRelease && !(maliRelease ==~ /v?[0-9]+(\.[0-9]+[a-z]*)*(-[0-9A-Za-z.]+)?/)) {
    throw new GradleException("The MaliBridge release must look like v0.5.4, not '${maliRelease}'")
}
// The .mali build's own version: versionName is the MaliBridge release (v0.5.4.1 -> "0.5.4.1") and
// versionCode is derived from it, ((major * 100 + minor) * 100 + patch) * 10 + hotfix (0.5.4.1 -> 5041),
// so each release installs over the one before and the updater's versionCode check holds. Letter and
// pre-release suffixes leave the code as it is. Every other build keeps DroidDeck's versionCode and
// versionName from defaultConfig.
// The RP4 Pro build's own release (fix43), which the updater compares instead of the MaliBridge release:
// DROIDDECK_RP4PRO_RELEASE (-Pdroiddeck.rp4proRelease), else tools/release/rp4pro-release.txt.
def rp4proRelease = buildSetting('DROIDDECK_RP4PRO_RELEASE', 'droiddeck.rp4proRelease') ?:
    (rootProject.file('tools/release/rp4pro-release.txt').with { it.isFile() ? it.readLines() : [] }
        .collect { it.trim() }.find { it && !it.startsWith('#') } ?: '')
if (rp4proRelease && !(rp4proRelease ==~ /fix[0-9]+/)) {
    throw new GradleException("The RP4 Pro release must look like fix43, not '${rp4proRelease}'")
}
def maliVersionCode = 0
def maliVersionName = ''
if (droiddeckApplicationId.endsWith('.mali') && maliRelease) {
    def numbers = maliRelease.replaceFirst(/^[vV]/, '').replaceFirst(/-.*$/, '').tokenize('.')
        .collect { (it =~ /^[0-9]+/)[0] as int }
    while (numbers.size() < 4) numbers << 0
    if (numbers.size() > 4 || numbers[1] > 99 || numbers[2] > 99 || numbers[3] > 9) {
        throw new GradleException("The MaliBridge release ${maliRelease} does not fit the .mali versionCode scheme")
    }
    maliVersionCode = ((numbers[0] * 100 + numbers[1]) * 100 + numbers[2]) * 10 + numbers[3]
    maliVersionName = maliRelease.replaceFirst(/^[vV]/, '')
    // The .mali builds before this scheme carried DroidDeck's versionCode 13
    if (maliVersionCode <= 13) {
        throw new GradleException("The .mali versionCode ${maliVersionCode} must stay above 13")
    }
}
if (droiddeckApplicationId != standardApplicationId || appLabel) {
    logger.lifecycle("DroidDeck side-by-side build: ${droiddeckApplicationId}" + (appLabel ? ", \"${appLabel}\"" : ''))
}

android {
    namespace 'com.droiddeck.launcher'
    compileSdk 34
    ndkVersion project.findProperty('ndkVersion') ?: '27.3.13750724'

    defaultConfig {
        applicationId droiddeckApplicationId
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 13
        versionName "0.4.0"
        buildConfigField "String", "BUILD_LABEL", "\"${escapedBuildLabel}\""
        buildConfigField "String", "SOURCE_COMMIT", "\"${sourceCommit}\""
        buildConfigField "String", "MALIBRIDGE_VERSION", "\"${maliBridgeVersion}\""
        buildConfigField "String", "UPDATES_REPO", "\"${maliUpdatesRepo}\""
        buildConfigField "String", "MALI_RELEASE", "\"${maliRelease}\""
        buildConfigField "String", "RP4PRO_RELEASE", "\"${rp4proRelease}\""
        buildConfigField "int", "PR_NUMBER", "${prNumber}"
        buildConfigField "boolean", "CI_BUILD", "${ciBuild}"
        buildConfigField "String", "RELEASE_SIGNER", "\"${releaseSigner}\""
        buildConfigField "long", "COMMIT_TIME", "${commitTime}L * 1000L"
        buildConfigField "String", "VARIANT_SUFFIXES", "\"${variantSuffixes}\""
        buildConfigField "String", "SGDB_API_KEY", "\"${System.getenv("SGDB_API_KEY") ?: project.findProperty("sgdbApiKey") ?: ""}\""
        buildConfigField "String", "DESKTOP_KDE_TAG", "\"${desktopKde.DESKTOP_KDE_TAG}\""
        buildConfigField "String", "DESKTOP_KDE_URL", "\"https://github.com/${desktopKde.DESKTOP_KDE_REPO}/releases/download/${desktopKde.DESKTOP_KDE_TAG}/desktop-kde.tar.zst\""
        buildConfigField "String", "DESKTOP_KDE_SHA256", "\"${desktopKde.DESKTOP_KDE_SHA256}\""
        buildConfigField "long", "DESKTOP_KDE_SIZE", "${desktopKde.DESKTOP_KDE_SIZE}L"
        // The .mali build's own version (see maliVersionCode above); the literal lines stay DroidDeck's
        if (maliVersionCode) {
            setVersionCode(maliVersionCode)
            setVersionName(maliVersionName)
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        // Lab signing key: keystore/lab-release.jks is local-only; passwords come from environment variables.
        lab {
            storeFile rootProject.file('keystore/lab-release.jks')
            storeType "PKCS12"
            storePassword System.getenv('LAB_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('LAB_KEY_ALIAS') ?: 'lab'
            keyPassword System.getenv('LAB_KEY_PASSWORD') ?: ''
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        testkey {
            storeFile file("${rootDir}/keystore/testkey.p12")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "testkey"
            keyPassword "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig rootProject.file('keystore/lab-release.jks').exists() ? signingConfigs.lab : signingConfigs.testkey
        }
        release {
            minifyEnabled false
            signingConfig rootProject.file('keystore/lab-release.jks').exists() ? signingConfigs.lab : signingConfigs.testkey
            // Mali bridge development fork: debuggable so `adb shell run-as` reaches the session
            // logs and VkBridgeNative's development override (-Pdroiddeck.notDebuggable to drop).
            debuggable !project.hasProperty('droiddeck.notDebuggable')
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libtermux.so']
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

def stageSessionScripts = tasks.register('stageSessionScripts', Copy) {
    from(rootProject.file('tools/linuxfs/overlay')) {
        include 'usr/local/bin/droiddeck-*', 'usr/local/bin/steam-compatibility', 'usr/bin/**'
    }
    into(layout.projectDirectory.dir('src/main/assets/linuxfs'))
}
tasks.named('preBuild').configure { dependsOn(stageSessionScripts) }

def runtimeAssetsDir = layout.buildDirectory.dir('runtimeAssets')
def stageRuntimeAssets = tasks.register('stageRuntimeAssets', Sync) {
    dependsOn(stageSessionScripts)
    from(layout.projectDirectory.dir('src/main/assets')) { exclude 'pulseaudio.tzst' }
    from(layout.buildDirectory.dir('prepared-assets'))
    into(runtimeAssetsDir)
}
android.sourceSets.main.assets.setSrcDirs([runtimeAssetsDir])
tasks.named('preBuild').configure { dependsOn(stageRuntimeAssets) }

def verifyRuntimeInputs = tasks.register('verifyRuntimeInputs', Exec) {
    mustRunAfter(stageSessionScripts, stageRuntimeAssets)
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/release/runtime_inputs.py', 'verify'
}
tasks.configureEach { task ->
    if (task.name in ['packageDebug', 'packageRelease']) task.dependsOn(verifyRuntimeInputs)
}

def rustCrateDir = layout.projectDirectory.dir('src/main/rust/stores')
def rustJniLibsDir = layout.buildDirectory.dir('rustJniLibs')
def skipRust = (project.findProperty('skipRust') ?: 'false').toString().toBoolean()
def buildRustStores = tasks.register('buildRustStores', Exec) {
    description = 'Cross-compiles the store download engines (libdroiddeckstores.so) with cargo-ndk.'
    onlyIf { !skipRust }
    inputs.dir(rustCrateDir.dir('src'))
    inputs.files(rustCrateDir.file('Cargo.toml'), rustCrateDir.file('Cargo.lock'))
    inputs.property('ndkVersion', android.ndkVersion)
    if (!skipRust) inputs.property('rustToolchain', providers.exec {
        environment 'PATH', "${System.getProperty('user.home')}/.cargo/bin${File.pathSeparator}${System.getenv('PATH')}"
        commandLine 'rustup', 'run', 'stable', 'rustc', '-Vv'
    }.standardOutput.asText)
    outputs.dir(rustJniLibsDir)
    workingDir rustCrateDir
    def cargoBin = "${System.getProperty('user.home')}/.cargo/bin"
    environment 'PATH', "${cargoBin}${File.pathSeparator}${System.getenv('PATH')}"
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    environment 'CARGO_TERM_COLOR', 'never'
    if (!skipRust) environment 'RUSTC', providers.exec {
        commandLine 'rustup', 'which', '--toolchain', 'stable', 'rustc'
    }.standardOutput.asText.get().trim()
    commandLine 'rustup', 'run', 'stable', 'cargo', 'ndk', '--target', 'arm64-v8a', '--platform', '26',
        '--output-dir', rustJniLibsDir.get().asFile.absolutePath,
        'build', '--release', '--locked'
}
if (!skipRust) android.sourceSets.main.jniLibs.srcDir(rustJniLibsDir)
tasks.named('preBuild').configure { dependsOn(buildRustStores) }

// The Mali bridge's server (the MaliBridge submodule, external/MaliBridge) is a program, not a library:
// it runs beside the session as the app's child, so a driver crash ends that process and not the
// app. AGP's CMake integration packages only shared libraries, so the NDK's clang builds it here
// into one more jniLibs source, named libvkbridge_server.so so Android extracts it (the native
// library directory is the one place the app may exec from).
def maliBridgeDir = rootProject.file('external/MaliBridge')
def vkbridgeJniLibsDir = layout.buildDirectory.dir('vkbridgeJniLibs')
def buildVkBridgeServer = tasks.register('buildVkBridgeServer', Exec) {
    description = 'Builds the Vulkan bridge server (libvkbridge_server.so) with the NDK.'
    inputs.dir(new File(maliBridgeDir, 'common'))
    inputs.dir(new File(maliBridgeDir, 'server'))
    inputs.file(new File(maliBridgeDir, 'scripts/build-server-android.sh'))
    outputs.dir(vkbridgeJniLibsDir)
    commandLine 'bash', new File(maliBridgeDir, 'scripts/build-server-android.sh').absolutePath,
        android.ndkDirectory.absolutePath, vkbridgeJniLibsDir.get().asFile.absolutePath
}
android.sourceSets.main.jniLibs.srcDir(vkbridgeJniLibsDir)
tasks.named('preBuild').configure { dependsOn(buildVkBridgeServer) }

dependencies {
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.flyfishxu:kadb-android:1.2.1'
    implementation 'com.termux.termux-app:terminal-view:0.118.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testRuntimeOnly 'com.github.luben:zstd-jni:1.5.7-4@jar'
}
